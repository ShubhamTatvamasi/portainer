---
- name: Resolve latest nvm version
  when: nvm_version == 'latest'
  ansible.builtin.uri:
    url: https://api.github.com/repos/nvm-sh/nvm/releases/latest
  register: nvm_latest

- name: Set nvm version fact
  ansible.builtin.set_fact:
    nvm_target: "{{ nvm_latest.json.tag_name if nvm_version == 'latest' else nvm_version }}"

- name: Check installed nvm version
  ansible.builtin.shell: source {{ ansible_env.HOME }}/.nvm/nvm.sh && nvm --version
  args:
    executable: /bin/bash
  register: nvm_installed
  changed_when: false
  failed_when: false

- name: Install nvm {{ nvm_target }}
  when: nvm_installed.stdout != nvm_target | regex_replace('^v', '')
  ansible.builtin.shell: >
    set -o pipefail &&
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_target }}/install.sh | bash
  args:
    executable: /bin/bash

- name: Install Node {{ node_version }}
  ansible.builtin.shell: >
    source {{ ansible_env.HOME }}/.nvm/nvm.sh &&
    nvm install '{{ node_version }}' &&
    nvm alias default '{{ node_version }}'
  args:
    executable: /bin/bash
  register: node_install
  changed_when: "'is already installed' not in node_install.stderr + node_install.stdout"
