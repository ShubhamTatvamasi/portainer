---
- name: Raise inotify limits (file watchers for pnpm dev / air)
  become: true
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-dev-inotify.conf
  loop: "{{ {'fs.inotify.max_user_watches': inotify_max_user_watches, 'fs.inotify.max_user_instances': inotify_max_user_instances} | dict2items }}"
